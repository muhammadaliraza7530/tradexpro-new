<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeXPro - Withdraw Methods</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='deposit-methods.css') }}">
</head>
<body class="dashboard-page deposit-page withdraw-page">
    <main class="dashboard-shell">
        <header class="deposit-header">
            <div class="deposit-title-group">
                <a class="deposit-back" href="{{ url_for('wallets') }}" aria-label="Back to wallet">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                </a>
                <h1>Withdraw Methods</h1>
            </div>
            <div class="top-actions">
                <a class="icon-button" href="{{ url_for('help_support') }}" aria-label="Help and support">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 13h3v6H5a2 2 0 0 1-2-2v-2a2 2 0 0 1 1-2Zm16 0h-3v6h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-1-2ZM9 20h5"/><circle cx="12" cy="4" r="1"/></svg>
                </a>
                <button class="icon-button notification-button" type="button" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg>
                </button>
            </div>
        </header>

        <section class="deposit-methods" aria-label="Choose a withdrawal method">
            <button class="deposit-method" type="button" data-method="USDT (TRC 20)" data-currency="USDT" data-confirm-url="/withdraw/confirm/7">
                <svg class="deposit-method-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14l1 9H4l1-9Zm7-6v9m-4-5h8m-5 5-5 3m6-3 5 3"/><path d="M3 20h18"/></svg>
                <span class="deposit-method-copy"><strong>USDT (TRC 20)</strong><small>Withdraw with currency: USDT</small></span>
                <svg class="deposit-method-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
            </button>
            <button class="deposit-method" type="button" data-method="USDT (BEP20)" data-currency="USDT" data-confirm-url="/withdraw/confirm/8">
                <svg class="deposit-method-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14l1 9H4l1-9Zm7-6v9m-4-5h8m-5 5-5 3m6-3 5 3"/><path d="M3 20h18"/></svg>
                <span class="deposit-method-copy"><strong>USDT (BEP20)</strong><small>Withdraw with currency: USDT</small></span>
                <svg class="deposit-method-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
            </button>
            <button class="deposit-method" type="button" data-method="Google Pay" data-currency="INR" data-confirm-url="/withdraw/confirm/9">
                <svg class="deposit-method-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14l1 9H4l1-9Zm7-6v9m-4-5h8m-5 5-5 3m6-3 5 3"/><path d="M3 20h18"/></svg>
                <span class="deposit-method-copy"><strong>Google Pay</strong><small>Withdraw with currency: INR</small></span>
                <svg class="deposit-method-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
            </button>
        </section>

        <nav class="bottom-nav" aria-label="Main navigation">
            <a class="nav-item" href="{{ url_for('dashboard') }}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
                <span>Home</span>
            </a>
            <a class="nav-item" href="{{ url_for('markets') }}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20V8M22 20V3"/></svg>
                <span>Markets</span>
            </a>
            <a class="nav-item" href="{{ url_for('bot_trade') }}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="10" cy="6" rx="7" ry="3"/><path d="M3 6v4c0 1.7 3.1 3 7 3M3 10v4c0 1.7 3.1 3 7 3M3 14v4c0 1.7 3.1 3 7 3M17 10c2.2 0 4-1 4-2s-1.8-2-4-2-4-1-4 2 1.8 2 4 2ZM13 8v3c0 1.1 1.8 2 4 2s4-.9 4-2V8m-8 3v3c0 1.1 1.8 2 4 2s4-.9 4-2v-3m-8 3v3c0 1.1 1.8 2 4 2s4-.9 4-2v-3"/></svg>
                <span>Bot Trade</span>
            </a>
            <a class="nav-item is-active" href="{{ url_for('wallets') }}" aria-current="page">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="15" rx="2"/><path d="M2 9h20m-5 5h2"/></svg>
                <span>Wallet</span>
            </a>
        </nav>
    </main>

    <script>
        document.querySelectorAll('[data-method]').forEach((method) => {
            method.addEventListener('click', () => {
                window.location.assign(method.dataset.confirmUrl);
            });
        });
    </script>
</body>
</html>
